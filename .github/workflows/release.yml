name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish framework-dependent (win-x64)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./artifacts/framework/publish

      - name: Publish self-contained (win-x64)
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./artifacts/selfcontained/publish

      - name: Package release zips
        shell: pwsh
        run: |
          Remove-Item -Path ./artifacts/framework/publish/*.pdb -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ./artifacts/selfcontained/publish/*.pdb -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path ./artifacts/framework/publish/* -DestinationPath ./artifacts/PC_HealthCheck_win-x64_framework.zip -Force
          Compress-Archive -Path ./artifacts/selfcontained/publish/* -DestinationPath ./artifacts/PC_HealthCheck_win-x64_selfcontained.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PC_HealthCheck_win-x64_framework.zip
            artifacts/PC_HealthCheck_win-x64_selfcontained.zip
          generate_release_notes: true
